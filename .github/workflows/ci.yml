name: CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edumaster_test
          POSTGRES_USER: edumaster
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: edumaster_test
      POSTGRES_USER: edumaster
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_APP_USER: minioadmin
      MINIO_APP_PASSWORD: minioadmin
      MINIO_PUBLIC_BUCKET: edumaster-public
      MINIO_PRIVATE_BUCKET: edumaster-private
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"

          echo "Waiting for MinIO to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              break
            fi
            sleep 1
          done

          docker run --rm --network host minio/mc sh -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/edumaster-public &&
            mc mb --ignore-existing local/edumaster-private &&
            mc anonymous set download local/edumaster-public
          "

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run lint (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --exclude=venv,migrations

      - name: Run tests
        run: |
          pip install pytest pytest-django pytest-cov
          pytest --cov=. --cov-report=term-missing

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edumaster-dj:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edumaster-dj:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dependencies for known vulnerabilities
        run: |
          pip install safety
          pip install -r requirements.txt
          safety check || true